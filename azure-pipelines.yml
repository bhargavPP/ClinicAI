trigger:
  branches:
    include:
      - master

stages:
  - stage: Build_API
    jobs:
      - job: BuildDotNet
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            inputs:
              version: '8.0.x'
          - script: dotnet restore
            workingDirectory: 'ClinicAI.API'
          - script: dotnet build --configuration Release
            workingDirectory: 'ClinicAI.API'
          - script: dotnet test --no-build
            workingDirectory: 'ClinicAI.API'
          - script: dotnet publish -c Release -o $(Build.ArtifactStagingDirectory)/api
            workingDirectory: 'ClinicAI.API'
          - publish: $(Build.ArtifactStagingDirectory)/api
            artifact: api-drop

  # ✅ NEW: Build Functions
  - stage: Build_Functions
    jobs:
      - job: BuildFunctions
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            inputs:
              version: '8.0.x'
          - script: dotnet restore
            workingDirectory: 'ClinicAI.Functions'
          - script: dotnet build --configuration Release
            workingDirectory: 'ClinicAI.Functions'
          - script: dotnet publish -c Release -o $(Build.ArtifactStagingDirectory)/functions
            workingDirectory: 'ClinicAI.Functions'
          - publish: $(Build.ArtifactStagingDirectory)/functions
            artifact: functions-drop

  - stage: Build_Angular
    jobs:
      - job: BuildAngular
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
          - script: npm ci
            workingDirectory: 'clinic-ai-ui'
          - script: npm run build -- --configuration production
            workingDirectory: 'clinic-ai-ui'
          - publish: clinic-ai-ui/dist
            artifact: angular-drop

  - stage: Deploy
    dependsOn:
      - Build_API
      - Build_Functions       # ✅ added
      - Build_Angular
    jobs:
      - deployment: DeployAPI
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: 'clinic-azure-service-connection'
                    appName: 'clinic-ai-api'
                    package: $(Pipeline.Workspace)/api-drop

      # ✅ NEW: Deploy Functions
      - deployment: DeployFunctions
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureFunctionApp@2
                  inputs:
                    azureSubscription: 'clinic-azure-service-connection'
                    appType: 'functionApp'        # or 'functionAppLinux'
                    appName: 'clinicai-functions'   # ← change this
                    package: $(Pipeline.Workspace)/functions-drop

      - deployment: DeployAngular
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: 'clinic-azure-service-connection'
                    appName: 'clinic-ai-ui'
                    package: $(Pipeline.Workspace)/angular-drop

<!-- 🔷 TOP HEADER -->
<div class="bg-dark text-white px-3 py-2 d-flex align-items-center">

  <!-- ☰ Toggle Button -->
  <button class="btn btn-sm btn-outline-light me-2"
          (click)="toggleSidebar()">
    ☰
  </button>

  <h6 class="mb-0 fw-semibold">Clinic AI</h6>

</div>

<!-- 🔽 MAIN LAYOUT -->
<div class="d-flex  " style="height: calc(100vh - 48px);">

  <!-- SIDEBAR -->
  <div class="sidebar bg-dark text-white"
       [class.collapsed]="!isSidebarOpen">

    <!--<h6 class="text-white fw-semibold mb-3">Menu</h6>-->

    <ul class="nav flex-column">

      <li class="nav-item mb-2">
        <a routerLink="/doctors"
           routerLinkActive="active"
           class="nav-link text-white">
          <span *ngIf="isSidebarOpen">Doctors</span>
        </a>
      </li>

      <li class="nav-item mb-2">
        <a routerLink="/availability"
           routerLinkActive="active"
           class="nav-link text-white">
          <span *ngIf="isSidebarOpen">Availability</span>
        </a>
      </li>

      <li class="nav-item mb-2">
        <a routerLink="/book"
           routerLinkActive="active"
           class="nav-link text-white">
          <span *ngIf="isSidebarOpen">Book Appointment</span>
        </a>
      </li>

      <li class="nav-item mb-2">
        <a routerLink="/admin"
           routerLinkActive="active"
           class="nav-link text-white">
          <span *ngIf="isSidebarOpen">Admin</span>
        </a>
      </li>

    </ul>

  </div>

  <!-- MAIN CONTENT -->
  <div class="content flex-grow-1 p-3 bg-light overflow-auto ">

    <app-toast></app-toast>
    <app-confirm></app-confirm>

    <router-outlet></router-outlet>

  </div>

</div>

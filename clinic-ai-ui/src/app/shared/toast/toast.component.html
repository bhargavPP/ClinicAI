<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;">

  <div *ngFor="let toast of toasts; let i = index"
       class="toast show align-items-center text-white border-0 mb-2 shadow-sm"
       [ngClass]="{
         'bg-success': toast.type === 'success',
         'bg-danger': toast.type === 'danger',
         'bg-warning text-dark': toast.type === 'warning',
         'bg-info text-dark': toast.type === 'info'
       }">

    <div class="d-flex">
      <div class="toast-body">
        {{ toast.text }}
      </div>
      <button type="button"
              class="btn-close btn-close-white me-2 m-auto"
              (click)="remove(i)">
      </button>
    </div>

  </div>

</div>

<div *ngIf="show" class="modal fade show d-block" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow">

      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title">Confirm Action</h5>
      </div>

      <div class="modal-body">
        <p class="mb-0">{{ message }}</p>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="no()">Cancel</button>
        <button class="btn btn-danger" (click)="yes()">Yes, Delete</button>
      </div>

    </div>
  </div>
</div>

<div *ngIf="show" class="modal-backdrop fade show"></div>

<div class="card shadow-sm border-0 mb-3">

  <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
    <div>
      <div class="fw-semibold">Availability Management</div>
      <small class="text-light opacity-75">Home / Admin / Availability</small>
    </div>
  </div>

  <div class="card-body py-2">

    <div class="row g-2 align-items-end">

      <div class="col-md-2">
        <select class="form-select form-select-sm" [(ngModel)]="model.doctorId">
          <option value="">Doctor</option>
          <option *ngFor="let doctor of doctors" [value]="doctor.id">
            {{ doctor.name }}
          </option>
        </select>
      </div>

      <div class="col-md-2">
        <input type="date" class="form-control form-control-sm"
               [(ngModel)]="model.date" [min]="minDate" />
      </div>

      <div class="col-md-2">
        <input type="time" class="form-control form-control-sm"
               [(ngModel)]="model.startTime" />
      </div>

      <div class="col-md-2">
        <input type="time" class="form-control form-control-sm"
               [(ngModel)]="model.endTime" />
      </div>

      <div class="col-md-2 d-flex align-items-center">
        <div class="form-check">
          <input class="form-check-input"
                 type="checkbox"
                 [(ngModel)]="model.isAvailable" />
          <label class="form-check-label small">Available</label>
        </div>
      </div>

      <div class="col-md-2">
        <button class="btn btn-primary btn-sm w-100" (click)="save()">
          {{ editMode ? 'Update' : 'Save' }}
        </button>
      </div>

    </div>

  </div>

</div>
<hr />

<div class="card shadow-sm border-0 mb-3">

  <div class="card-body py-2">

    <div class="row g-2 align-items-end">

      <div class="col-md-3">
        <select class="form-select form-select-sm" [(ngModel)]="filters.doctorId">
          <option value="">All Doctors</option>
          <option *ngFor="let doctor of doctors" [value]="doctor.id">
            {{ doctor.name }}
          </option>
        </select>
      </div>

      <div class="col-md-3">
        <input type="date" class="form-control form-control-sm"
               [(ngModel)]="filters.fromDate" />
      </div>

      <div class="col-md-3">
        <input type="date" class="form-control form-control-sm"
               [(ngModel)]="filters.toDate" />
      </div>

      <div class="col-md-3">
        <button class="btn btn-secondary btn-sm w-100"
                (click)="loadAvailabilities()">
          Search
        </button>
      </div>

    </div>

  </div>

</div>
<div class="container-fluid mt-3 px-1">

  <div class="card shadow-sm border-0 w-100">

    <div class="card-header bg-dark text-white d-flex justify-content-between">
      <span>{{ editMode ? 'Edit Availability' : 'Availability List' }}</span>

      <button *ngIf="editMode"
              class="btn btn-sm btn-light"
              (click)="resetForm()">
        Cancel
      </button>
    </div>

    <div class="card-body p-2">

      <div class="table-responsive">
        <table class="table table-sm align-middle table-hover mb-0">

          <!-- HEADER -->
          <thead class="table-light">
            <tr>
              <th>Doctor</th>
              <th>Date</th>
              <th>Start</th>
              <th>End</th>
              <th>Is Available</th>
              <th class="text-center">Action</th>
            </tr>
          </thead>

          <!-- BODY -->
          <tbody>
            <tr *ngFor="let a of availabilities" [class.table-warning]="editMode && editingId === a.id">

              <td class="fw-semibold">{{ a.doctorName }}</td>

              <td>{{ a.date | date:'yyyy-MM-dd' }}</td>

              <td>{{ a.startTime }}</td>

              <td>{{ a.endTime }}</td>

              <td class="text-center">
                <input type="checkbox" disabled
                       [checked]="a.isAvailable"
                       style="transform: scale(0.9);" />
              </td>
              <td class="text-center">
                <div class="form-check d-flex justify-content-center">
                  <button class="btn btn-secondary btn-sm me-2 px-3"
                          (click)="edit(a)">
                    Edit
                  </button>

                  <button class="btn btn-danger btn-sm px-3"
                          (click)="delete(a.id)">
                    Delete
                  </button>
                </div>
              </td>

            </tr>
          </tbody>

        </table>
      </div>

    </div>

  </div>

</div>
